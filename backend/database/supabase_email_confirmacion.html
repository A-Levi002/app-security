<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>SECURE_OS · Confirma tu cuenta</title>
</head>
<body style="margin:0;padding:0;background-color:#0c0c0d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0c0c0d;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background-color:#141416;border-radius:28px;border:1px solid rgba(255,255,255,0.12);overflow:hidden;">
          <tr>
            <td align="center" style="padding:36px 28px 12px;">
              <!-- Botón redondo con la inicial del glifo S -->
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="width:96px;height:96px;border-radius:48px;background-color:#fff;">
                    <span style="display:inline-block;font-size:44px;line-height:96px;font-weight:700;color:#0c0c0d;">S</span>
                  </td>
                </tr>
              </table>
              <div style="height:20px;"></div>
              <div style="font-size:11px;letter-spacing:4px;color:#8e9192;text-transform:uppercase;">Sistema de Emergencias</div>
              <h1 style="margin:10px 0 6px;font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#e5e2e1;">SECURE_OS</h1>
              <div style="font-size:12px;color:#8e9192;letter-spacing:2px;text-transform:uppercase;">La IA al servicio de la vida</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 28px 8px;">
              <div style="font-size:15px;color:#fff;line-height:22px;">
                Para activar tu cuenta y comenzar a recibir el despacho 911, confirma tu dirección de correo.
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="border-radius:48px;background-color:#fff;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 40px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#131313;text-decoration:none;">Aceptar</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 28px;">
              <div style="font-size:11px;color:#5b5e5f;line-height:17px;max-width:320px;">
                Si no creaste esta cuenta, ignora este correo. El enlace expirará y no da acceso sin tu confirmación.
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 28px 30px;">
              <div style="font-size:10px;color:#8e9192;letter-spacing:2px;text-transform:uppercase;">Protocolo Táctico · V-1.0.4</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
